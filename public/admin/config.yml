backend:
  name: github
  repo: juzttheek/Tourvir
  branch: main

media_libraries:
  cloudinary:
    config:
      cloud_name: xgme9clf
      api_key: 236693324451995
      default_transformations:
        - [{ fetch_format: auto, quality: auto }]

media_folder: 'public/images/uploads'
public_folder: '/images/uploads'

collections:
  - name: 'testimonials'
    label: 'Testimonials'
    folder: 'src/data/testimonials'
    create: true
    format: 'json'
    extension: 'json'
    slug: '{{slug}}'
    fields:
      - { label: 'Name', name: 'name', widget: 'string' }
      - { label: 'Origin', name: 'origin', widget: 'string', hint: 'e.g. London, United Kingdom' }
      - { label: 'Rating', name: 'rating', widget: 'number', min: 1, max: 5, default: 5 }
      - { label: 'Quote', name: 'quote', widget: 'text' }

  - name: 'gallery'
    label: 'Gallery'
    folder: 'src/data/gallery'
    create: true
    format: 'json'
    extension: 'json'
    slug: '{{slug}}'
    fields:
      - { label: 'Image', name: 'image', widget: 'image' }
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Location', name: 'location', widget: 'string', hint: 'e.g. Southern Province' }
      - {
          label: 'Category',
          name: 'category',
          widget: 'select',
          options: ['beaches', 'heritage', 'wildlife', 'mountains', 'culture', 'temples'],
        }
      - {
          label: 'Alt Text',
          name: 'alt',
          widget: 'string',
          required: false,
          hint: 'Accessibility description',
        }
      - {
          label: 'Grid Size',
          name: 'orientation',
          widget: 'select',
          options: ['standard', 'wide', 'tall'],
          default: 'standard',
          hint: 'Controls how much space the image takes in the masonry grid',
        }
