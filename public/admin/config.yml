backend:
  name: github
  repo: juzttheek/Tourvir
  branch: main

media_libraries:
  cloudinary:
    config:
      cloud_name: iglq8j73
      api_key: 158278583556913
      default_transformations:
        - [{ fetch_format: auto, quality: auto }]

media_folder: 'public/images/uploads'
public_folder: '/images/uploads'

collections:
  - name: 'testimonials'
    label: 'Testimonials'
    folder: 'src/data/testimonials'
    create: true
    format: 'json'
    extension: 'json'
    slug: '{{slug}}'
    fields:
      - { label: 'Name', name: 'name', widget: 'string' }
      - { label: 'Origin', name: 'origin', widget: 'string', hint: 'e.g. London, United Kingdom' }
      - { label: 'Rating', name: 'rating', widget: 'number', min: 1, max: 5, default: 5 }
      - { label: 'Quote', name: 'quote', widget: 'text' }

  - name: 'gallery'
    label: 'Gallery'
    folder: 'src/data/gallery'
    create: true
    format: 'json'
    extension: 'json'
    slug: '{{slug}}'
    fields:
      - { label: 'Image', name: 'image', widget: 'image', media_library: { config: { default_transformations: [[ {fetch_format: auto, quality: auto} ]], tags: ['tourvir-gallery'], folder: 'tourvir-gallery' } } }
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Location', name: 'location', widget: 'string', hint: 'e.g. Southern Province' }
      - {
          label: 'Category',
          name: 'category',
          widget: 'select',
          options: ['beaches', 'heritage', 'wildlife', 'mountains', 'culture', 'temples'],
        }
      - {
          label: 'Alt Text',
          name: 'alt',
          widget: 'string',
          required: false,
          hint: 'Accessibility description',
        }
      - {
          label: 'Grid Size',
          name: 'orientation',
          widget: 'select',
          options: ['standard', 'wide', 'tall'],
          default: 'standard',
          hint: 'Controls how much space the image takes in the masonry grid',
        }

  - name: 'blog'
    label: 'Blog'
    folder: 'src/data/blog'
    create: true
    format: 'json'
    extension: 'json'
    slug: '{{slug}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Description', name: 'description', widget: 'text' }
      - { label: 'Cover Image', name: 'coverImage', widget: 'image', required: false }
      - { label: 'Author', name: 'author', widget: 'string', default: 'Tourvir Team' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD' }
      - { label: 'Body', name: 'content', widget: 'text' }

  - name: 'packages'
    label: 'Packages'
    folder: 'src/data/packages'
    create: true
    format: 'json'
    extension: 'json'
    slug: '{{slug}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Category Name', name: 'category', widget: 'select', options: ['cultural', 'beach', 'wildlife', 'adventure', 'honeymoon'] }
      - { label: 'Category Label', name: 'categoryLabel', widget: 'string', hint: 'e.g. Cultural, Beach' }
      - { label: 'Duration (Days)', name: 'duration', widget: 'number' }
      - { label: 'Duration Label', name: 'durationLabel', widget: 'string', required: false, hint: 'Optional, e.g. 5 Days / 4 Nights' }
      - { label: 'Price (USD)', name: 'price', widget: 'number' }
      - { label: 'Price Suffix', name: 'priceSuffix', widget: 'string', default: 'per person' }
      - { label: 'Cover Image', name: 'image', widget: 'image' }
      - { label: 'Alt Text', name: 'alt', widget: 'string' }
      - { label: 'Rating', name: 'rating', widget: 'number', min: 1, max: 5, default: 5 }
      - { label: 'Review Count', name: 'reviewCount', widget: 'number', min: 0, default: 0 }
      - { label: 'Highlights', name: 'highlights', widget: 'list', field: { label: 'Highlight', name: 'highlight', widget: 'string' } }
      - { label: 'Recommended Vehicles', name: 'recommendedVehicles', widget: 'list', required: false, field: { label: 'Vehicle Name', name: 'vehicle', widget: 'string' } }
      - name: 'routeMap'
        label: 'Route Map Points'
        widget: 'list'
        fields:
          - { label: 'Stop Name', name: 'name', widget: 'string' }
          - { label: 'Coordinates [Lat, Lng]', name: 'coordinates', widget: 'list', field: { label: 'Coordinate', name: 'coord', widget: 'number' } }
      - name: 'itinerary'
        label: 'Day-by-Day Itinerary'
        widget: 'list'
        required: false
        fields:
          - { label: 'Day Number', name: 'day', widget: 'string', hint: 'e.g. Day 1' }
          - { label: 'Title', name: 'title', widget: 'string' }
          - { label: 'Description', name: 'description', widget: 'text' }

  - name: 'vehicles'
    label: 'Vehicles'
    folder: 'src/data/vehicles'
    create: true
    format: 'json'
    extension: 'json'
    slug: '{{slug}}'
    fields:
      - { label: 'ID', name: 'id', widget: 'string' }
      - { label: 'Name', name: 'name', widget: 'string' }
      - { label: 'Badge', name: 'badge', widget: 'string', hint: 'e.g. Popular, Premium' }
      - { label: 'Image', name: 'image', widget: 'image' }
      - { label: 'Alt Text', name: 'alt', widget: 'string' }
      - { label: 'Price (USD/day)', name: 'price', widget: 'number', min: 0 }
      - { label: 'Price Suffix', name: 'priceSuffix', widget: 'string', default: '/day' }
      - { label: 'Specs', name: 'specs', widget: 'list', field: { label: 'Specification', name: 'spec', widget: 'string' } }
